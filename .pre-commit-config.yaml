repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.1
    hooks:
      - id: pyrefly-check
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.15
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: lint-imports
        name: lint-imports
        entry: .venv/bin/lint-imports
        language: system
        files: ^(src/.*\.py|pyproject\.toml)$
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest -q
        language: system
        files: ^(src|tests)/.*\.py$|^pyproject\.toml$
        pass_filenames: false
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.82.0
    hooks:
      - id: oxlint
        args: [-c, frontend/.oxlintrc.json]
        files: ^frontend/
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.67.0
    hooks:
      - id: oxfmt
        args: [--check, -c, frontend/.oxfmtrc.json]
        files: ^frontend/
  - repo: local
    hooks:
      - id: tsc
        name: tsc
        entry: tsc -b frontend
        language: node
        additional_dependencies: ["typescript@7.0.2"]
        files: ^frontend/
        pass_filenames: false
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.1
    hooks:
      - id: commitizen
