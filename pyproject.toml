[project]
name = "truman"
version = "0.1.0"
description = "Simulate, evaluate and improve AI agents"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
truman = "truman.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truman"]

[dependency-groups]
dev = [
    "ruff",
    "pyrefly",
    "pytest",
    "pytest-asyncio",
    "prek",
    "commitizen",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.13"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
