[project]
name = "yaksh"
version = "0.10.3"
description = "Simulate, evaluate and improve AI agents"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "aiobotocore>=3.9.1",
    "aiohttp>=3.14",
    "alembic>=1.20.0",
    "anyio>=4.15.1",
    "asyncpg>=0.31.0",
    "audioop-lts>=0.2.2",
    "cryptography>=50.0.2",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "openai>=3.14.1",
    "pipecat-ai[assemblyai,azure,cartesia,deepgram,elevenlabs,gladia,openai,sarvam,silero,soniox,typesafe]>=1.14.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "regex>=2025.9.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
    "yarl>=1.25",
]

[project.scripts]
yaksh-server = "yaksh.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yaksh"]

[dependency-groups]
dev = [
    "ruff",
    "pyrefly",
    "pytest",
    "pytest-asyncio",
    "prek",
    "commitizen",
    "httpx>=0.28.1",
    "testcontainers[postgres]>=4.15.0",
    "import-linter>=2.15",
    "types-pyyaml>=6.0.12.20260906",
    "types-aiobotocore-s3>=3.9.1",
    "types-regex>=2026.9.10.20260911",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["yaksh", "tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-version = "3.14"
python-interpreter-path = ".venv/bin/python"

[tool.pyrefly.errors]
deprecated = "error"

[tool.importlinter]
root_package = "yaksh"

[[tool.importlinter.contracts]]
name = "domain imports nothing from yaksh"
type = "forbidden"
source_modules = ["yaksh.domain"]
forbidden_modules = [
    "yaksh.__main__",
    "yaksh.api",
    "yaksh.caller",
    "yaksh.config",
    "yaksh.db",
    "yaksh.diagnostics",
    "yaksh.evaluation",
    "yaksh.integrations",
    "yaksh.simulation",
    "yaksh.worker",
]

[[tool.importlinter.contracts]]
name = "diagnostics imports nothing from yaksh"
type = "forbidden"
source_modules = ["yaksh.diagnostics"]
forbidden_modules = [
    "yaksh.__main__",
    "yaksh.api",
    "yaksh.caller",
    "yaksh.config",
    "yaksh.db",
    "yaksh.domain",
    "yaksh.evaluation",
    "yaksh.integrations",
    "yaksh.simulation",
    "yaksh.worker",
]

[[tool.importlinter.contracts]]
name = "integrations import only the domain and diagnostics"
type = "forbidden"
source_modules = ["yaksh.integrations"]
forbidden_modules = [
    "yaksh.__main__",
    "yaksh.api",
    "yaksh.caller",
    "yaksh.config",
    "yaksh.db",
    "yaksh.evaluation",
    "yaksh.simulation",
    "yaksh.worker",
]

[[tool.importlinter.contracts]]
name = "simulation and evaluation never import the caller or integrations"
type = "forbidden"
source_modules = ["yaksh.simulation", "yaksh.evaluation"]
forbidden_modules = ["yaksh.caller", "yaksh.integrations"]

[[tool.importlinter.contracts]]
name = "the caller never imports simulation or evaluation"
type = "forbidden"
source_modules = ["yaksh.caller"]
forbidden_modules = ["yaksh.simulation", "yaksh.evaluation"]

[[tool.importlinter.contracts]]
name = "evaluation never imports simulation"
type = "forbidden"
source_modules = ["yaksh.evaluation"]
forbidden_modules = ["yaksh.simulation"]

[[tool.importlinter.contracts]]
name = "api and worker are entry points, nothing imports them"
type = "forbidden"
source_modules = [
    "yaksh.domain",
    "yaksh.db",
    "yaksh.simulation",
    "yaksh.evaluation",
    "yaksh.caller",
]
forbidden_modules = ["yaksh.api", "yaksh.worker"]

[[tool.importlinter.contracts]]
name = "db holds no business logic"
type = "forbidden"
source_modules = ["yaksh.db"]
forbidden_modules = ["yaksh.simulation", "yaksh.evaluation", "yaksh.caller", "yaksh.integrations"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "uv"
major_version_zero = true
update_changelog_on_bump = true
annotated_tag = true
version_files = [
    "docker/compose.yaml:ghcr.io/plivo-labs/yaksh:",
    "cli/openapi.json:^    \"version\": ",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
