[project]
name = "truman"
version = "0.1.0"
description = "Simulate, evaluate and improve AI agents"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "audioop-lts>=0.2.2",
    "fastapi>=0.141.1",
    "pipecat-ai[deepgram,elevenlabs,silero]>=1.10.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.54",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
truman = "truman.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truman"]

[dependency-groups]
dev = [
    "ruff",
    "pyrefly",
    "pytest",
    "pytest-asyncio",
    "prek",
    "commitizen",
    "httpx>=0.28.1",
    "testcontainers[postgres]>=4.15.0",
    "import-linter>=2.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["truman", "tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-version = "3.13"
python-interpreter-path = ".venv/bin/python"

[tool.pyrefly.errors]
deprecated = "error"

[tool.importlinter]
root_package = "truman"

[[tool.importlinter.contracts]]
name = "domain imports nothing from truman"
type = "forbidden"
source_modules = ["truman.domain"]
forbidden_modules = [
    "truman.api",
    "truman.caller",
    "truman.config",
    "truman.db",
    "truman.evaluation",
    "truman.simulation",
    "truman.worker",
]

[[tool.importlinter.contracts]]
name = "simulation and evaluation never import the caller"
type = "forbidden"
source_modules = ["truman.simulation", "truman.evaluation"]
forbidden_modules = ["truman.caller"]

[[tool.importlinter.contracts]]
name = "evaluation never imports simulation"
type = "forbidden"
source_modules = ["truman.evaluation"]
forbidden_modules = ["truman.simulation"]

[[tool.importlinter.contracts]]
name = "api and worker are entry points, nothing imports them"
type = "forbidden"
source_modules = [
    "truman.domain",
    "truman.db",
    "truman.simulation",
    "truman.evaluation",
    "truman.caller",
]
forbidden_modules = ["truman.api", "truman.worker"]

[[tool.importlinter.contracts]]
name = "db holds no business logic"
type = "forbidden"
source_modules = ["truman.db"]
forbidden_modules = ["truman.simulation", "truman.evaluation", "truman.caller"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
