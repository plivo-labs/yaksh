[project]
name = "yaksha"
version = "0.1.0"
description = "Simulate, evaluate and improve AI agents"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "aiobotocore>=3.9.1",
    "aiohttp>=3.14",
    "alembic>=1.20.0",
    "anyio>=4.15.1",
    "asyncpg>=0.31.0",
    "audioop-lts>=0.2.2",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "openai>=3.14.1",
    "pipecat-ai[deepgram,elevenlabs,silero,jev]>=1.12.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "regex>=2025.9.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
yaksha-server = "yaksha.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yaksha"]

[dependency-groups]
dev = [
    "ruff",
    "pyrefly",
    "pytest",
    "pytest-asyncio",
    "prek",
    "commitizen",
    "httpx>=0.28.1",
    "testcontainers[postgres]>=4.15.0",
    "import-linter>=2.15",
    "types-pyyaml>=6.0.12.20260906",
    "types-aiobotocore-s3>=3.9.1",
    "types-regex>=2026.9.10.20260911",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["yaksha", "tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-version = "3.14"
python-interpreter-path = ".venv/bin/python"

[tool.pyrefly.errors]
deprecated = "error"

[tool.importlinter]
root_package = "yaksha"

[[tool.importlinter.contracts]]
name = "domain imports nothing from yaksha"
type = "forbidden"
source_modules = ["yaksha.domain"]
forbidden_modules = [
    "yaksha.__main__",
    "yaksha.api",
    "yaksha.caller",
    "yaksha.config",
    "yaksha.db",
    "yaksha.diagnostics",
    "yaksha.evaluation",
    "yaksha.integrations",
    "yaksha.simulation",
    "yaksha.worker",
]

[[tool.importlinter.contracts]]
name = "diagnostics imports nothing from yaksha"
type = "forbidden"
source_modules = ["yaksha.diagnostics"]
forbidden_modules = [
    "yaksha.__main__",
    "yaksha.api",
    "yaksha.caller",
    "yaksha.config",
    "yaksha.db",
    "yaksha.domain",
    "yaksha.evaluation",
    "yaksha.integrations",
    "yaksha.simulation",
    "yaksha.worker",
]

[[tool.importlinter.contracts]]
name = "integrations import only the domain and diagnostics"
type = "forbidden"
source_modules = ["yaksha.integrations"]
forbidden_modules = [
    "yaksha.__main__",
    "yaksha.api",
    "yaksha.caller",
    "yaksha.config",
    "yaksha.db",
    "yaksha.evaluation",
    "yaksha.simulation",
    "yaksha.worker",
]

[[tool.importlinter.contracts]]
name = "simulation and evaluation never import the caller or integrations"
type = "forbidden"
source_modules = ["yaksha.simulation", "yaksha.evaluation"]
forbidden_modules = ["yaksha.caller", "yaksha.integrations"]

[[tool.importlinter.contracts]]
name = "evaluation never imports simulation"
type = "forbidden"
source_modules = ["yaksha.evaluation"]
forbidden_modules = ["yaksha.simulation"]

[[tool.importlinter.contracts]]
name = "api and worker are entry points, nothing imports them"
type = "forbidden"
source_modules = [
    "yaksha.domain",
    "yaksha.db",
    "yaksha.simulation",
    "yaksha.evaluation",
    "yaksha.caller",
]
forbidden_modules = ["yaksha.api", "yaksha.worker"]

[[tool.importlinter.contracts]]
name = "db holds no business logic"
type = "forbidden"
source_modules = ["yaksha.db"]
forbidden_modules = ["yaksha.simulation", "yaksha.evaluation", "yaksha.caller", "yaksha.integrations"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
