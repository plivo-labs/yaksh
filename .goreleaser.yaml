version: 2

project_name: yaksh

builds:
  - dir: cli
    binary: yaksh
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # No version in the name, so releases/latest/download/<name> always works.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  prerelease: auto
