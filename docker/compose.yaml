name: truman

services:
  truman:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: truman:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TRUMAN_API_HOST: 0.0.0.0
      TRUMAN_API_PORT: 8000
      TRUMAN_DATABASE_URL: postgresql+asyncpg://truman:truman@postgres:5432/truman
      TRUMAN_DATA_DIR: /app/data
    volumes:
      - truman_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: truman
      POSTGRES_PASSWORD: truman
      POSTGRES_DB: truman
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U truman -d truman
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  truman_data:
