name: truman

x-truman: &truman
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: truman:local
  env_file:
    - path: .env
      required: false
  environment:
    TRUMAN_API_HOST: 0.0.0.0
    TRUMAN_API_PORT: 8000
    TRUMAN_DATABASE_URL: postgresql+asyncpg://truman:truman@postgres:5432/truman
    TRUMAN_DATA_DIR: /app/data
  volumes:
    - truman_data:/app/data
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  truman:
    <<: *truman
    ports:
      - "8000:8000"

  worker:
    <<: *truman
    command:
      - truman
      - worker
    ports:
      - "8770:8770"
    # Must exceed the worker's drain bound: Worker._execute_bound plus its
    # cancel wait plus bounded_dispose, about 120 s at the default end timeout.
    stop_grace_period: 150s
    healthcheck:
      disable: true

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: truman
      POSTGRES_PASSWORD: truman
      POSTGRES_DB: truman
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U truman -d truman
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  truman_data:
