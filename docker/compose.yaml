name: yaksha

x-yaksha: &yaksha
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: yaksha:local
  env_file:
    - path: .env
      required: false
  environment:
    YAKSHA_API_HOST: 0.0.0.0
    YAKSHA_DATABASE_URL: postgresql+asyncpg://yaksha:yaksha@postgres:5432/yaksha
    YAKSHA_S3_ENDPOINT: ${YAKSHA_S3_ENDPOINT:-http://storage:8333}
    YAKSHA_S3_BUCKET: ${YAKSHA_S3_BUCKET:-yaksha}
    YAKSHA_S3_ACCESS_KEY: ${YAKSHA_S3_ACCESS_KEY:-yaksha}
    YAKSHA_S3_SECRET_KEY: ${YAKSHA_S3_SECRET_KEY:-yaksha-storage}
  depends_on:
    postgres:
      condition: service_healthy
    storage:
      condition: service_started
  restart: unless-stopped

services:
  yaksha:
    <<: *yaksha
    ports:
      - "8000:8000"

  worker:
    <<: *yaksha
    command:
      - yaksha-server
      - worker
    ports:
      - "8770:8770"
    # Must exceed the worker's drain bound: Worker._execute_bound plus its
    # cancel wait plus bounded_dispose, about 180 s at the default end timeout.
    stop_grace_period: 210s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen(f"http://127.0.0.1:{os.environ.get('PORT', '8770')}/health")

  evaluator:
    <<: *yaksha
    command:
      - yaksha-server
      - evaluator
    healthcheck:
      disable: true

  storage:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -bucket=yaksha
      - -admin.ui=false
    environment:
      AWS_ACCESS_KEY_ID: yaksha
      AWS_SECRET_ACCESS_KEY: yaksha-storage
    volumes:
      - storage:/data
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: yaksha
      POSTGRES_PASSWORD: yaksha
      POSTGRES_DB: yaksha
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U yaksha -d yaksha
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  storage:
