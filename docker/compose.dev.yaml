name: yaksha

x-yaksha: &yaksha
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: dev
  volumes:
    - ../src:/app/src
  env_file:
    - path: .env
      required: false
  environment:
    YAKSHA_API_HOST: 0.0.0.0
    YAKSHA_API_PORT: 8000
    YAKSHA_DATABASE_URL: postgresql+asyncpg://yaksha:yaksha@postgres:5432/yaksha
    YAKSHA_S3_ENDPOINT: ${YAKSHA_S3_ENDPOINT:-http://storage:8333}
    YAKSHA_S3_BUCKET: ${YAKSHA_S3_BUCKET:-yaksha}
    YAKSHA_S3_ACCESS_KEY: ${YAKSHA_S3_ACCESS_KEY:-yaksha}
    YAKSHA_S3_SECRET_KEY: ${YAKSHA_S3_SECRET_KEY:-yaksha-storage}
  depends_on:
    postgres:
      condition: service_healthy
    storage:
      condition: service_started

services:
  api:
    <<: *yaksha
    ports:
      - "8000:8000"

  worker:
    <<: *yaksha
    command:
      - yaksha-server
      - worker
    ports:
      - "8770:8770"
    # Must exceed the worker's drain bound: Worker._execute_bound plus its
    # cancel wait plus bounded_dispose, about 180 s at the default end timeout.
    stop_grace_period: 210s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen(f"http://127.0.0.1:{os.environ.get('PORT', '8770')}/health")

  evaluator:
    <<: *yaksha
    command:
      - yaksha-server
      - evaluator

  web:
    image: oven/bun:1.3.9-slim
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    profiles:
      - tunnel
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://worker:8770

  storage:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -bucket=yaksha
      - -admin.ui=false
    environment:
      AWS_ACCESS_KEY_ID: yaksha
      AWS_SECRET_ACCESS_KEY: yaksha-storage
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage:/data

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: yaksha
      POSTGRES_PASSWORD: yaksha
      POSTGRES_DB: yaksha
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U yaksha -d yaksha
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  storage:
  web_node_modules:
