name: truman

x-truman: &truman
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: dev
  volumes:
    - ../src:/app/src
    - truman_data:/app/data
  env_file:
    - path: .env
      required: false
  environment:
    TRUMAN_API_HOST: 0.0.0.0
    TRUMAN_API_PORT: 8000
    TRUMAN_DATABASE_URL: postgresql+asyncpg://truman:truman@postgres:5432/truman
    TRUMAN_DATA_DIR: /app/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  api:
    <<: *truman
    ports:
      - "8000:8000"

  worker:
    <<: *truman
    command:
      - truman
      - worker
    ports:
      - "8770:8770"
    # Must exceed the worker's drain bound: Worker._execute_bound plus its
    # cancel wait plus bounded_dispose, about 120 s at the default end timeout.
    stop_grace_period: 150s

  web:
    image: oven/bun:1.3.9-slim
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: truman
      POSTGRES_PASSWORD: truman
      POSTGRES_DB: truman
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U truman -d truman
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  truman_data:
  web_node_modules:
