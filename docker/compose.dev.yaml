name: yaksh

x-yaksh: &yaksh
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: dev
  volumes:
    - ../src:/app/src
  env_file:
    - path: .env
      required: false
  environment:
    YAKSH_API_HOST: 0.0.0.0
    YAKSH_DATABASE_URL: postgresql+asyncpg://yaksh:yaksh@postgres:5432/yaksh
    YAKSH_S3_ENDPOINT: ${YAKSH_S3_ENDPOINT:-http://storage:8333}
    YAKSH_S3_BUCKET: ${YAKSH_S3_BUCKET:-yaksh}
    YAKSH_S3_ACCESS_KEY: ${YAKSH_S3_ACCESS_KEY:-yaksh}
    YAKSH_S3_SECRET_KEY: ${YAKSH_S3_SECRET_KEY:-yaksh-storage}
  depends_on:
    postgres:
      condition: service_healthy
    storage:
      condition: service_healthy

services:
  api:
    <<: *yaksh
    ports:
      - "8000:8000"

  worker:
    <<: *yaksh
    command:
      - yaksh-server
      - worker
    ports:
      - "8770:8770"
    # Must exceed the worker's drain bound: Worker._execute_bound plus its
    # cancel wait plus bounded_dispose, about 180 s at the default end timeout.
    stop_grace_period: 210s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen(f"http://127.0.0.1:{os.environ.get('PORT', '8770')}/health")

  evaluator:
    <<: *yaksh
    command:
      - yaksh-server
      - evaluator

  web:
    image: oven/bun:1.3.9-slim
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    profiles:
      - tunnel
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://worker:8770

  storage:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -bucket=yaksh
      - -admin.ui=false
    environment:
      AWS_ACCESS_KEY_ID: yaksh
      AWS_SECRET_ACCESS_KEY: yaksh-storage
    # The S3 port opens before the bucket exists; the filer lists the bucket once it does.
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 8333 && wget -q -O /dev/null http://127.0.0.1:8888/buckets/yaksh/
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage:/data

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: yaksh
      POSTGRES_PASSWORD: yaksh
      POSTGRES_DB: yaksh
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U yaksh -d yaksh
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  storage:
  web_node_modules:
