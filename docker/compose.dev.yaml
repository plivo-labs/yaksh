name: truman

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    volumes:
      - ../src:/app/src
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TRUMAN_API_HOST: 0.0.0.0
      TRUMAN_API_PORT: 8000

  web:
    image: oven/bun:1.3.9-slim
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  web_node_modules:
