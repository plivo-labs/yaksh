name: cli

on:
  push:
    branches: [dev, main]
  pull_request:
    paths:
      - cli/**
      - src/yaksh/**
      - scripts/export_openapi.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/cli.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: The spec and the generated client match the server
        run: |
          uv sync --locked
          uv run python ../scripts/export_openapi.py
          go generate ./internal/api
          git diff --exit-code -- openapi.json internal/api/client.gen.go
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go tool staticcheck ./...
      - name: Test
        run: go test -race ./...
